name: Verify V3 rules and release resources
on:
  push:
    branches: [main, release/pocket-arcade-v3]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic game, physics, scoring and migration regressions
        run: node tests/run-logic.cjs
      - name: CSP and offline dependency integrity
        run: node tests/resources.cjs
